name: security-lint
on: [push, pull_request]
permissions: { contents: read }
jobs:
  dotnet:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: "8.0.x" }
      - run: dotnet build -warnaserror:CA2100,CA3001
      - name: Vulnerable packages
        run: |
          $out = dotnet list package --vulnerable --include-transitive
          $out
          if ($out -match "has the following vulnerable") { exit 1 }
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Gitleaks
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar -xz gitleaks
          ./gitleaks detect --source . -v
